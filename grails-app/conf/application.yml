---
grails:
    profile: web
    codegen:
        defaultPackage: dictionary
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
    cors:
        enabled: true



#        allowedHeaders:
#            - Access-Control-Allow-Origin
#            - Access-Control-Allow-Credentials
#            - Access-Control-Allow-Methods
#            - Access-Control-Max-Age
#        allowedOrigins:
#            - http://localhost:8080
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    session:
        store-type: jdbc
        jdbc:
            initialize-schema: never
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback.groovy'
                - '*.properties'
management:
    endpoints:
        enabled-by-default: false

# The commented springsecurity.rest blocks were removed 2026-11-04
# (cherokeedictionary#121): dead residue carrying committed secret values.

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none
management:
    endpoints:
        jmx:
            unique-names: true

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
        #        cache.provider_class: 'org.hibernate.cache.EhCacheProvider'
        lazy: false
        max_fetch_depth: '5'
    allow_update_outside_transaction: true
dataSource:
    pooled: true
    jmxExport: true
    dialect: org.hibernate.dialect.MySQL5Dialect
    #org.hibernate.dialect.MySQL5InnoDBDialect
    driverClassName: com.mysql.cj.jdbc.Driver
    dbCreate: update

environments:
    development:
        hibernate:
            default_catalog: ${DB_NAME:cherokeedictionary}
        dataSource:
            #            logSql: true
            username: ${DB_USER}
            password: ${DB_PASSWORD}
            url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cherokeedictionary}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
            properties:
                readOnly: false
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 10000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 5000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED
    test:
        dataSource:
            url: jdbc:h2:mem:testDb;MVCC=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
            username: sa
            password: ''
    production:
        # grails.serverURL intentionally absent (recorded decision 2026-11-04,
        # #119 R-4 amendment): request-derived via forward headers.
        hibernate:
            # PoC finding 2026-11-03: Hibernate 5.4's schema extractor falls through to
            # `catalogFilter=""` when neither currentCatalog nor defaultCatalog resolves,
            # and Connector/J treats an empty-string catalog as "no catalog" — metadata
            # returns empty, hbm2ddl update emits create-all for existing tables and the
            # missing-column ALTERs never run. Pin the catalog explicitly; the JDBC URL
            # stays byte-identical (the spec rule).
            default_catalog: ${DB_NAME:likespreadsheets}
        dataSource:
            dbCreate: update
            username: ${DB_USER}
            password: ${DB_PASSWORD}
            url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:likespreadsheets}?useUnicode=yes&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
            properties:
                readOnly: false
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 10000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 5000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED