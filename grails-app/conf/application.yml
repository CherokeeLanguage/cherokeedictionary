---
grails:
    profile: web
    codegen:
        defaultPackage: dictionary
    controllers:
        upload:
            # Grails's own multipart caps (default 128000 bytes = 125KB) — these
            # override spring.servlet.multipart in Grails 4 and were rejecting
            # real PDFs (see SizeLimitExceededException 2026-11-19)
            maxFileSize: 262144000      # 250MB per file
            maxRequestSize: 283115520   # 270MB total request
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
    cors:
        enabled: true



#        allowedHeaders:
#            - Access-Control-Allow-Origin
#            - Access-Control-Allow-Credentials
#            - Access-Control-Allow-Methods
#            - Access-Control-Max-Age
#        allowedOrigins:
#            - http://localhost:8080
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'

# DocRepo (certified-upload document repository, /docrepo) — see the
# docrepo.* controllers/services/domains. PRODUCTION NOTE: the dict-app
# container has no persistent volume by default, so set
# DOCREPO_STORAGE_DIR to a bind-mounted host path (e.g. add
# /srv/cherokeedictionary/docrepo-files:/app/docrepo-files to the
# dict-app compose service and point this env var at it) — files written
# to an unmounted container path are lost on redeploy.
docrepo:
    storageDir: '/var/cherokeeUmbrella/'
    registration:
        enabled: false       # wire-flip for self-registration + admin approval (register endpoint exists)
    bootstrap:
        adminPassword: ${DOCREPO_BOOTSTRAP_ADMIN_PASSWORD:}   # dev env block below supplies a local default
    auth:
        providers:
            local:
                enabled: true
            google:          # scaffold only — sign-in implementation comes later if wanted; no Google Drive integration
                enabled: false
                clientId: ${DOCREPO_GOOGLE_CLIENT_ID:}
                clientSecret: ${DOCREPO_GOOGLE_CLIENT_SECRET:}

server:
    tomcat:
        # let Tomcat drain oversized request bodies so rejected uploads get a
        # clean 413 response instead of a connection reset (default 2MB)
        max-swallow-size: -1

spring:
    session:
        store-type: jdbc
        jdbc:
            initialize-schema: never
    servlet:
        multipart:
            max-file-size: 250MB    # corpus has 70MB+ PDFs
            max-request-size: 260MB
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback.groovy'
                - '*.properties'
management:
    endpoints:
        enabled-by-default: false

# The commented springsecurity.rest blocks were removed 2026-11-04
# (cherokeedictionary#121): dead residue carrying committed secret values.

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
        upload:
            maxFileSize: 262144000      # 250 MB in bytes (250 * 1024 * 1024)
            maxRequestSize: 272629760   # 260 MB in bytes (260 * 1024 * 1024)
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none
management:
    endpoints:
        jmx:
            unique-names: true

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
        #        cache.provider_class: 'org.hibernate.cache.EhCacheProvider'
        lazy: false
        max_fetch_depth: '5'
    allow_update_outside_transaction: true
dataSource:
    pooled: true
    jmxExport: true
    # InnoDB dialect: docrepo (document repository) writes are multi-statement
    # (supersede + insert + audit) and need real transactions; the MyISAM
    # default of MySQL5Dialect also misbehaved with BIT(1) boolean updates.
    # Existing dictionary tables keep their engine; new tables land as InnoDB.
    dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    driverClassName: com.mysql.cj.jdbc.Driver
    dbCreate: update

environments:
    development:
        hibernate:
            default_catalog: ${DB_NAME:cherokeedictionary}
        docrepo:
            bootstrap:
                adminPassword: ${DOCREPO_BOOTSTRAP_ADMIN_PASSWORD:admin123}
        dataSource:
            #            logSql: true
            username: root
            password: Tk02030#
            url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cherokeedictionary}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
            properties:
                readOnly: false
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 10000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 5000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED
    test:
        dataSource:
            url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cherokeedictionary}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
            username: root
            password: root
    production:
        # grails.serverURL intentionally absent (recorded decision 2026-11-04,
        # #119 R-4 amendment): request-derived via forward headers.
        hibernate:
            # PoC finding 2026-11-03: Hibernate 5.4's schema extractor falls through to
            # `catalogFilter=""` when neither currentCatalog nor defaultCatalog resolves,
            # and Connector/J treats an empty-string catalog as "no catalog" — metadata
            # returns empty, hbm2ddl update emits create-all for existing tables and the
            # missing-column ALTERs never run. Pin the catalog explicitly; the JDBC URL
            # stays byte-identical (the spec rule).
            default_catalog: ${DB_NAME:likespreadsheets}
        dataSource:
            dbCreate: update
            username: root
            password: Tk02030#
            url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:likespreadsheets}?useUnicode=yes&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
            properties:
                readOnly: false
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 10000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 5000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED